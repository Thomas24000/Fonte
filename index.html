<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fonte</title>
<meta name="description" content="Tes salles, tes séances et tes poids de muscu.">
<meta name="theme-color" content="#121416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fonte">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, phone-first. Séances as chips, exercises as stacked cards with a big weight readout and the plates per side. */
:root{
  --bg:#eef0ee; --surface:#ffffff; --fg:#17191b; --muted:#5d6468; --line:#d6dbd8;
  --accent:#1c5bd6; --accent-fg:#ffffff; --ok:#1f8a4c; --danger:#c0352b; --chip:#e1e5e2; --t-poulie:#7a3fc4;
  --p25:#d23a2f; --p20:#1c5bd6; --p15:#e3b419; --p10:#2f9a50; --p5:#f4f4f2; --p25s:#2a2c2e; --p125:#9aa1a6; --plate-line:#17191b33;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121416; --surface:#1b1e21; --fg:#eceeed; --muted:#9aa2a6; --line:#2c3135;
  --accent:#5b8cf0; --accent-fg:#0d1420; --ok:#4cc07d; --danger:#ef6b5f; --chip:#24282c; --t-poulie:#b48af0;
  --p5:#dcdcd8; --p25s:#4a4e52; --plate-line:#00000055; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121416; --surface:#1b1e21; --fg:#eceeed; --muted:#9aa2a6; --line:#2c3135;
  --accent:#5b8cf0; --accent-fg:#0d1420; --ok:#4cc07d; --danger:#ef6b5f; --chip:#24282c; --t-poulie:#b48af0;
  --p5:#dcdcd8; --p25s:#4a4e52; --plate-line:#00000055; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:620px;margin:0 auto;padding-block:20px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;font-weight:800;text-transform:uppercase}
h2{font-size:28px;font-weight:700}
h3{font-size:22px;font-weight:700;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.status{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:8px 16px;font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip.add{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.banner{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.shead .meta{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.done{opacity:.55}
.card.done h3{text-decoration:line-through}
.chead{display:flex;gap:10px;align-items:flex-start}
.chead h3{flex:1;min-width:0}
.tick{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tick svg{width:16px;height:16px}
.scheme{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.scheme b{color:var(--fg);font-weight:600}
.wline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:600;line-height:1}
.weight{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:center;background:none;border:0;padding:0}
.weight small{font-size:18px;font-weight:600;color:var(--muted);margin-left:2px}
.trend{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.trend .up{color:var(--ok);font-weight:600}
.trend svg{width:70px;height:26px;overflow:visible}
.plates{display:flex;align-items:center;gap:2px;height:46px}
.plates .bar{width:26px;height:6px;background:var(--p125);border-radius:2px}
.plates .collar{width:6px;height:16px;background:var(--p125);border-radius:2px;margin-right:2px}
.plate{width:10px;border-radius:3px;border:1px solid var(--plate-line)}
.platecap{font-size:12px;color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;white-space:pre-wrap}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:24px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;color:var(--muted);max-width:46ch}
.foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot .in{max-width:620px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.gyms{display:flex;flex-direction:column;gap:10px}
.gym{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.gym:hover{border-color:var(--accent)}
.gym .gname{font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.gym .gmeta{font-size:13px;color:var(--muted)}
.gym .gmeta b{color:var(--accent);font-weight:600}
.gym.add{border-style:dashed;color:var(--muted);font-weight:500;align-items:center}
.gymbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.gymname{font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted);min-width:0}
.gymname::before{content:"Salle · ";font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:6px;margin-bottom:5px;border:1px solid currentColor}
.t-barre{color:var(--p25)}
.t-halteres{color:var(--ok)}
.t-machine{color:var(--accent)}
.t-poulie{color:var(--t-poulie)}
.t-corps{color:var(--muted)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:7px;vertical-align:middle}
.today{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:2px}
.btn.isdone{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.hint{margin:0;font-size:13px;color:var(--muted)}
.hint b{color:var(--danger)}
textarea.code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:vertical;word-break:break-all}
.backup{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:4px}
.backup span{margin-right:4px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
.field input,.field select,.field textarea{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sheet .actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .2s}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <div class="top"><h1>Fonte</h1><span class="status" id="status">Chargement…</span></div>
  <div class="empty"><p>Chargement de tes salles…</p></div>
</div>

<script>
(function(){
const LKEY="carnet-salle-v1", LASTGYM="carnet-salle-derniere";
let state={gyms:[]};
let gymId=null;              // salle choisie pour cette visite (null = écran de choix)
let current=null;            // id de la séance affichée
let ref=null, mode="local", loaded=false;
let saveTimer=null, saving=false, dirty=false;
let armed=null;              // bouton de suppression armé
let sheetSave=()=>{};
let editing=null;            // {kind:"gym"|"session"|"ex", target, focus}

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmt=n=>{const r=Math.round(n*100)/100;return String(r).replace(".",",")};
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const dateFr=s=>{const [y,m,d]=s.split("-");return (+d)+" "+MOIS[+m-1]};
const plural=(n,w)=>n+" "+w+(n>1?"s":"");
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function exampleSessions(){
  const ex=(name,sets,reps,weight,type,rest,note,hist)=>({id:uid(),name,sets,reps,weight,step:type==="barre"||type==="poulie"?2.5:type==="halteres"?2:5,type,rest,note:note||"",history:hist||[{d:today(),w:weight}]});
  return [
    {id:uid(),name:"Push",exercises:[
      ex("Développé couché",4,8,70,"barre",150,"Omoplates serrées, pieds ancrés.",[{d:"2026-10-26",w:65},{d:"2026-11-09",w:67.5},{d:"2026-11-16",w:70}]),
      ex("Développé militaire",3,8,40,"barre",120),
      ex("Développé incliné haltères",3,10,24,"halteres",90),
      ex("Élévations latérales",3,15,8,"halteres",60),
      ex("Extensions triceps poulie",3,12,25,"poulie",60)]},
    {id:uid(),name:"Pull",exercises:[
      ex("Soulevé de terre",3,5,110,"barre",180,"",[{d:"2026-10-28",w:100},{d:"2026-11-11",w:105},{d:"2026-11-18",w:110}]),
      ex("Tractions",4,8,0,"corps",120,"Ajouter du lest quand 4×10 passe."),
      ex("Rowing barre",4,8,60,"barre",120),
      ex("Curl haltères",3,12,12,"halteres",60)]},
    {id:uid(),name:"Legs",exercises:[
      ex("Squat",4,6,90,"barre",180,"",[{d:"2026-10-30",w:82.5},{d:"2026-11-13",w:87.5},{d:"2026-11-20",w:90}]),
      ex("Presse à cuisses",3,10,160,"machine",120),
      ex("Leg curl",3,12,40,"machine",60),
      ex("Mollets debout",4,15,60,"machine",45)]}
  ];
}
function copySessions(src){
  return JSON.parse(JSON.stringify(src)).map(s=>({id:uid(),name:s.name,exercises:(s.exercises||[]).map(e=>({...e,id:uid(),history:[{d:today(),w:e.weight}]}))}));
}

/* ---------- stockage ---------- */
function setStatus(t){const el=$("#status");if(el)el.textContent=t}
function persist(){
  if(mode==="local"){lsSet(LKEY,JSON.stringify(state)); setStatus("Enregistré sur cet appareil");return}
  dirty=true; setStatus("Enregistrement…");
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,600);
}
async function flush(){
  if(saving||!ref)return; if(!dirty)return;
  saving=true; dirty=false;
  try{await ref.set(JSON.parse(JSON.stringify(state))); setStatus("Enregistré")}
  catch(e){showErr("sauvegarde : "+((e&&(e.code+" "+(e.message||"")))||e));setStatus(e&&e.code==="quota_exceeded"?"Stockage plein":"Échec de l'enregistrement, réessaie"); dirty=true}
  saving=false; if(dirty) saveTimer=setTimeout(flush,600);
}
function adopt(raw){
  let data=null; try{data=raw?JSON.parse(JSON.stringify(raw)):null}catch(e){}
  let migrated=false;
  if(Array.isArray(data?.gyms)) state={gyms:data.gyms};
  else if(Array.isArray(data?.sessions)&&data.sessions.length){
    // ancien format sans salles : tout va dans « Ma salle »
    state={gyms:[{id:uid(),name:"Ma salle",example:!!data.example,sessions:data.sessions}]}; migrated=true;
  } else state={gyms:[]};
  if(gymId&&!G()) gymId=null;
  if(G()&&!sess()) current=G().sessions[0]?.id||null;
  loaded=true; render();
  if(migrated) persist();
}
async function init(){
  let db=null,user=null,id=null;
  try{
    if(window.claude&&window.claude.use){
      [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(user) id=await user.id();
    }
  }catch(e){}
  if(db&&id){
    mode="db"; ref=db.doc("data/users/"+id+"/programme");
    const t=setTimeout(()=>{if(!loaded){setStatus("Connexion lente…");}},10000);
    ref.onSnapshot(snap=>{
      if(!snap.metadata.fromCache) clearTimeout(t);
      if(saving||dirty||snap.metadata.hasPendingWrites||(loaded&&editing)){ if(!loaded) adopt(snap.data()); return; }
      adopt(snap.exists?snap.data():null);
      setStatus(snap.metadata.fromCache?"Hors ligne":"Synchronisé");
    },e=>{clearTimeout(t);setStatus("Données indisponibles");if(!loaded)adopt(null)});
  }else{
    mode="local";
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
    let d=null; try{d=JSON.parse(lsGet(LKEY)||"null")}catch(e){}
    adopt(d); setStatus("Sauvegardé sur cet appareil");
  }
}

/* ---------- helpers métier ---------- */
const G=()=>state.gyms.find(g=>g.id===gymId);
const sess=()=>G()?.sessions.find(s=>s.id===current);
function findEx(id){for(const s of (G()?.sessions||[])){const e=s.exercises.find(x=>x.id===id);if(e)return e}return null}
function enterGym(id){gymId=id;lsSet(LASTGYM,id);current=nextSession(G())?.id||null;armed=null;render();try{window.scrollTo(0,0)}catch(e){}}
/* ---------- rotation des séances ---------- */
// g.done = {idSéance: "AAAA-MM-JJ"} : dernier jour où la séance a été faite dans cette salle
function daysAgo(d){return Math.round((new Date(today()+"T12:00")-new Date(d+"T12:00"))/864e5)}
function sinceTxt(d){if(!d)return "jamais faite ici";const n=daysAgo(d);return n<=0?"faite aujourd'hui":n===1?"faite hier":"faite il y a "+n+" jours"}
function lastDone(g){
  // la séance faite le plus récemment (à date égale, la plus loin dans l'ordre)
  let best=null,bi=-1;
  (g.sessions||[]).forEach((s,i)=>{const d=g.done?.[s.id];if(d&&(!best||d>best.d||(d===best.d&&i>bi))){best={s,d};bi=i}});
  return best;
}
function nextSession(g){
  if(!g||!g.sessions.length)return null;
  const l=lastDone(g); if(!l)return g.sessions[0];
  if(l.d===today())return l.s;                       // déjà commencée aujourd'hui : on y reste
  const i=g.sessions.indexOf(l.s); return g.sessions[(i+1)%g.sessions.length];
}
function markDone(s,on=true){const g=G();if(!g||!s)return;g.done=g.done||{};if(on)g.done[s.id]=today();else delete g.done[s.id]}
function sessOfEx(id){return G()?.sessions.find(s=>s.exercises.some(x=>x.id===id))}
function setWeight(e,w){
  w=Math.max(0,Math.round(w*100)/100); if(w===e.weight)return false;
  e.weight=w; e.history=e.history||[];
  const last=e.history[e.history.length-1];
  if(last&&last.d===today()) last.w=w; else e.history.push({d:today(),w});
  if(e.history.length>60) e.history=e.history.slice(-60);
  return true;
}
const PLATES=[[25,"--p25"],[20,"--p20"],[15,"--p15"],[10,"--p10"],[5,"--p5"],[2.5,"--p25s"],[1.25,"--p125"]];
function plates(total){
  let side=(total-20)/2; if(side<=0) return null; const out=[];
  for(const [p,c] of PLATES){while(side>=p-1e-9){out.push([p,c]);side=Math.round((side-p)*100)/100}}
  return {list:out,rest:side};
}
function spark(h){
  if(!h||h.length<2) return "";
  const pts=h.slice(-8), ws=pts.map(p=>p.w), mn=Math.min(...ws), mx=Math.max(...ws), rg=mx-mn||1;
  const xy=pts.map((p,i)=>[(i/(pts.length-1))*70, 22-((p.w-mn)/rg)*18]);
  const d=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const e=xy[xy.length-1];
  return `<svg viewBox="0 0 70 26" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${e[0]}" cy="${e[1]}" r="3" fill="var(--accent)"/></svg>`;
}
const TYPES={barre:"Barre (20 kg)",halteres:"Haltères (par main)",machine:"Machine guidée",poulie:"Poulie / câble",corps:"Poids du corps (+ lest)"};
const TAGS={barre:"Barre",halteres:"Haltères",machine:"Machine",poulie:"Poulie",corps:"Poids du corps"};

/* ---------- rendu ---------- */
function render(){
  const app=$("#app"), status=$("#status")?.textContent||"";
  let h=`<div class="top"><h1>Fonte</h1><span class="status" id="status">${esc(status)}</span></div>`;
  if(editing){
    app.innerHTML=h+`<div id="sheet"></div>`;
    if(editing.kind==="gym") gymSheet(editing.target);
    else if(editing.kind==="export") exportSheet();
    else if(editing.kind==="import") importSheet();
    else if(editing.kind==="session") sessionSheet(editing.target);
    else exSheet(editing.target,editing.focus);
    return;
  }
  if(!loaded){app.innerHTML=h+`<div class="empty"><p>Chargement de tes salles…</p></div>`;return}

  /* écran d'arrivée : choix de la salle */
  if(!G()){
    if(!state.gyms.length){
      h+=`<div class="empty"><h2>À quelle salle es-tu ?</h2>
        <p>Ajoute la salle où tu t'entraînes. Chaque salle a ses propres séances, exercices et poids, puisque les machines changent d'un endroit à l'autre.</p>
        <div class="row"><button class="btn primary" data-act="new-gym" id="b-new-gym">Ajouter ma salle</button>
        <button class="btn" data-act="import">J'ai une sauvegarde à importer</button></div></div>`;
    }else{
      const last=lsGet(LASTGYM);
      h+=`<h2>À quelle salle es-tu ?</h2><div class="gyms">`+state.gyms.map(g=>{
        const nx=g.sessions.reduce((a,s)=>a+s.exercises.length,0);
        return `<button class="gym" data-act="enter-gym" data-id="${g.id}"><span class="gname">${esc(g.name)}</span><span class="gmeta">${plural(g.sessions.length,"séance")} · ${plural(nx,"exercice")}${g.id===last?` · <b>dernière visite</b>`:""}${g.sessions.length?`<br>Séance du jour : ${esc(nextSession(g).name)}`:""}</span></button>`}).join("")+
        `<button class="gym add" data-act="new-gym">+ Ajouter une salle</button></div>
        <div class="backup"><span>Sauvegarde</span><button class="btn ghost" data-act="export">Exporter mes données</button><button class="btn ghost" data-act="import">Importer</button></div>`;
    }
    app.innerHTML=h; return;
  }

  const g=G();
  h+=`<div class="gymbar"><span class="gymname">${esc(g.name)}</span><div class="row"><button class="btn ghost" data-act="edit-gym">Modifier la salle</button><button class="btn" data-act="change-gym">Changer de salle</button></div></div>`;
  if(!g.sessions.length){
    h+=`<div class="empty"><h2>Aucune séance à ${esc(g.name)}</h2>
      <p>Crée une séance (par exemple « Push », « Haut du corps » ou « Lundi »), puis ajoute-y tes exercices avec leurs séries, répétitions et poids.</p>
      <div class="row"><button class="btn primary" data-act="new-session" id="b-new">Créer ma première séance</button>
      ${state.gyms.length>1?"":`<button class="btn" data-act="load-example" id="b-ex">Partir d'un exemple Push / Pull / Legs</button>`}</div></div>`;
    app.innerHTML=h; return;
  }
  const nx=nextSession(g);
  h+=`<div class="chips" role="toolbar" aria-label="Séances">${g.sessions.map(s=>`<button class="chip" data-act="pick" data-id="${s.id}" aria-pressed="${s.id===current}">${esc(s.name)}${s===nx?`<span class="dot" title="Séance du jour"></span>`:""}</button>`).join("")}<button class="chip add" data-act="new-session" aria-label="Ajouter une séance">+ Séance</button></div>`;
  if(g.example){
    h+=`<div class="banner"><span>Programme d'exemple : modifie-le à ta sauce, ou repars de zéro.</span><button class="btn danger ${armed==="wipe"?"armed":""}" data-act="wipe">${armed==="wipe"?"Confirmer : tout effacer":"Tout effacer"}</button></div>`;
  }
  const s=sess();
  if(s){
    const doneDay=g.done?.[s.id], doneToday=doneDay===today();
    h+=`<div class="shead"><div>${s===nx?`<span class="today">Séance du jour</span>`:""}<h2>${esc(s.name)}</h2><div class="meta">${plural(s.exercises.length,"exercice")} · ${sinceTxt(doneDay)}</div></div>
      <div class="row"><button class="btn ${doneToday?"isdone":""}" data-act="toggle-done" aria-pressed="${doneToday}">${doneToday?"Faite aujourd'hui ✓":"Marquer comme faite"}</button><button class="btn" data-act="edit-session">Renommer</button><button class="btn" data-act="new-ex">+ Exercice</button></div></div>`;
    if(!s.exercises.length) h+=`<div class="empty"><p>Aucun exercice dans cette séance.</p><button class="btn primary" data-act="new-ex">Ajouter un exercice</button></div>`;
    h+=`<div class="list">`+s.exercises.map(e=>{
      const hist=e.history||[], first=hist[0], lastUp=hist[hist.length-1];
      const delta=first?e.weight-first.w:0;
      let trend="";
      if(hist.length>=2) trend=`<div class="trend">${spark(hist)}<span>${delta>0?`<span class="up">+${fmt(delta)} kg</span>`:delta<0?`${fmt(delta)} kg`:"="}<br>depuis ${dateFr(first.d)}</span></div>`;
      let pl="";
      if(e.type==="barre"){const p=plates(e.weight);
        if(p&&p.list.length){pl=`<div class="plates" aria-label="Disques par côté"><div class="bar"></div><div class="collar"></div>${p.list.map(([v,c])=>`<div class="plate" title="${fmt(v)} kg" style="background:var(${c});height:${Math.round(18+v*1.1)}px"></div>`).join("")}<span class="platecap">par côté : ${p.list.map(x=>fmt(x[0])).join(" + ")}${p.rest>0?` (+${fmt(p.rest)})`:""}</span></div>`}
        else if(e.weight>0&&e.weight<=20) pl=`<div class="platecap" style="margin:0">Barre seule</div>`;}
      const unit=e.type==="corps"?(e.weight>0?"kg lest":"PDC"):e.type==="halteres"?"kg/main":"kg";
      return `<article class="card">
        <div class="chead">
          <div style="flex:1;min-width:0"><span class="tag t-${esc(e.type)}">${esc(TAGS[e.type]||"")}</span><h3>${esc(e.name)}</h3><div class="scheme"><b>${e.sets} × ${esc(e.reps)}</b>${e.rest?` · repos ${fmt(e.rest/60)} min`:""}${lastUp?` · poids du ${dateFr(lastUp.d)}`:""}</div></div>
          <button class="btn ghost" data-act="edit-ex" data-id="${e.id}" aria-label="Modifier ${esc(e.name)}">Modifier</button></div>
        <div class="wline"><button class="step" data-act="minus" data-id="${e.id}" aria-label="Retirer ${fmt(e.step)} kg">−</button>
          <button class="weight" data-act="edit-ex" data-id="${e.id}" data-focus="weight">${e.type==="corps"&&!e.weight?"PDC":fmt(e.weight)}<small>${e.type==="corps"&&!e.weight?"":unit}</small></button>
          <button class="step" data-act="plus" data-id="${e.id}" aria-label="Ajouter ${fmt(e.step)} kg">+</button>${trend}</div>
        ${pl}${e.note?`<div class="note">${esc(e.note)}</div>`:""}
      </article>`}).join("")+`</div>`;
  }
  app.innerHTML=h;
}

/* ---------- formulaires ---------- */
function openEditor(kind,target,focus){editing={kind,target,focus};armed=null;render();try{window.scrollTo(0,0)}catch(e){}}
function closeSheet(){editing=null;armed=null;sheetSave=()=>{};render()}
function gymSheet(g){
  const others=state.gyms.filter(x=>x.sessions.length);
  $("#sheet").innerHTML=`<div class="sheet">
    <h2>${g?"Modifier la salle":"Nouvelle salle"}</h2>
    <label class="field">Nom de la salle<input id="gym-name" maxlength="40" value="${esc(g?.name||"")}" placeholder="Ex. Basic-Fit Centre, salle du boulot"></label>
    ${!g&&others.length?`<label class="field">Programme de départ<select id="gym-copy"><option value="">Vide, je saisis tout</option>${others.map(o=>`<option value="${o.id}">Copier les séances de ${esc(o.name)}</option>`).join("")}</select></label>
    <p class="hint">La copie reprend les séances, exercices et poids. Tu ajustes ensuite ce qui change ici ; l'autre salle n'est pas modifiée.</p>`:""}
    <div class="actions"><div>${g?`<button type="button" class="btn danger" data-act="del-gym">Supprimer la salle</button>`:""}</div>
      <div class="row"><button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="save">${g?"Enregistrer":"Ajouter la salle"}</button></div></div></div>`;
  $("#gym-name").focus();
  sheetSave=()=>{const name=$("#gym-name").value.trim();if(!name){$("#gym-name").focus();return}
    if(g){g.name=name;persist();closeSheet();return}
    const src=$("#gym-copy")?.value, from=state.gyms.find(x=>x.id===src);
    const n={id:uid(),name,sessions:from?copySessions(from.sessions):[]};
    state.gyms.push(n); persist(); editing=null; sheetSave=()=>{}; enterGym(n.id);};
}
function exportSheet(){
  const txt=JSON.stringify({app:"fonte",v:1,exporte:today(),gyms:state.gyms});
  $("#sheet").innerHTML=`<div class="sheet">
    <h2>Exporter mes données</h2>
    <p class="hint">Copie ce texte, puis colle-le dans « Importer » sur l'autre version de Fonte. Il contient toutes tes salles, séances, poids et historiques.</p>
    <textarea id="exp-txt" class="code" rows="8" readonly>${esc(txt)}</textarea>
    <div class="actions"><div></div><div class="row"><button type="button" class="btn" data-act="close">Fermer</button><button type="button" class="btn primary" data-act="copy-export" id="b-copy">Copier</button></div></div></div>`;
}
function parseBackup(txt){
  let d; try{d=JSON.parse(txt)}catch(e){return null}
  if(Array.isArray(d?.gyms)&&d.gyms.every(g=>g&&typeof g.name==="string"&&Array.isArray(g.sessions))) return d.gyms;
  if(Array.isArray(d?.sessions)) return [{id:uid(),name:"Ma salle",sessions:d.sessions}];
  return null;
}
function importSheet(){
  $("#sheet").innerHTML=`<div class="sheet">
    <h2>Importer une sauvegarde</h2>
    <p class="hint">Colle ici le texte copié avec « Exporter mes données ». ${state.gyms.length?"<b>Ça remplace tout ce qui est déjà ici</b> ("+plural(state.gyms.length,"salle")+").":""}</p>
    <textarea id="imp-txt" class="code" rows="8" placeholder='{"app":"fonte", …}'></textarea>
    <p class="hint" id="imp-msg" hidden></p>
    <div class="actions"><div></div><div class="row"><button type="button" class="btn" data-act="close">Annuler</button><button type="button" class="btn primary" data-act="do-import" id="b-imp">Importer</button></div></div></div>`;
  $("#imp-txt").focus();
}
function sessionSheet(s){
  $("#sheet").innerHTML=`<div class="sheet">
    <h2>${s?"Modifier la séance":"Nouvelle séance"}</h2>
    <label class="field">Nom<input id="sess-name" maxlength="40" value="${esc(s?.name||"")}" placeholder="Ex. Push, Haut du corps, Lundi"></label>
    <div class="actions"><div>${s?`<button type="button" class="btn danger" data-act="del-session">Supprimer la séance</button>`:""}</div>
      <div class="row"><button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="save">${s?"Enregistrer":"Créer"}</button></div></div></div>`;
  $("#sess-name").focus();
  sheetSave=()=>{const name=$("#sess-name").value.trim();if(!name){$("#sess-name").focus();return}
    if(s) s.name=name; else {const n={id:uid(),name,exercises:[]};G().sessions.push(n);current=n.id}
    persist();closeSheet();};
}
function exSheet(e,focus){
  const v=e||{name:"",sets:3,reps:"10",weight:20,step:2.5,type:"barre",rest:90,note:""};
  $("#sheet").innerHTML=`<div class="sheet">
    <h2>${e?"Modifier l'exercice":"Nouvel exercice"}</h2>
    <label class="field">Exercice<input id="ex-name" maxlength="60" value="${esc(v.name)}" placeholder="Ex. Squat"></label>
    <label class="field">Matériel<select id="ex-type">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${k===v.type?"selected":""}>${l}</option>`).join("")}</select></label>
    <div class="grid3"><label class="field">Séries<input id="ex-sets" type="number" inputmode="numeric" min="1" max="20" value="${v.sets}"></label>
      <label class="field">Reps<input id="ex-reps" maxlength="12" value="${esc(v.reps)}" placeholder="8 ou 8-12"></label>
      <label class="field">Repos (min)<input id="ex-rest" inputmode="decimal" value="${fmt((v.rest||0)/60)}" placeholder="1,5"></label></div>
    <div class="grid2"><label class="field">Poids (kg)<input id="ex-weight" inputmode="decimal" value="${fmt(v.weight)}"></label>
      <label class="field">Pas du + / − (kg)<input id="ex-step" inputmode="decimal" value="${fmt(v.step)}"></label></div>
    <label class="field">Note<textarea id="ex-note" rows="2" maxlength="300" placeholder="Réglage machine, consigne technique…">${esc(v.note)}</textarea></label>
    <div class="actions"><div>${e?`<button type="button" class="btn danger" data-act="del-ex" data-id="${e.id}">Supprimer</button>`:""}</div>
      <div class="row"><button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="save">${e?"Enregistrer":"Ajouter"}</button></div></div></div>`;
  const inp=focus==="weight"?$("#ex-weight"):$("#ex-name"); inp.focus(); if(focus==="weight") inp.select();
  sheetSave=()=>{
    const name=$("#ex-name").value.trim(); if(!name){$("#ex-name").focus();return}
    if(!e&&!sess()){showErr("aucune séance sélectionnée");return}
    const t=e||{id:uid(),history:[]};
    t.name=name; t.type=$("#ex-type").value; t.sets=Math.max(1,Math.round(num($("#ex-sets").value))||1);
    t.reps=$("#ex-reps").value.trim()||"10"; t.rest=Math.max(0,Math.round(num($("#ex-rest").value)*60));
    t.step=num($("#ex-step").value)||2.5; t.note=$("#ex-note").value.trim();
    const w=num($("#ex-weight").value);
    if(e){ if(setWeight(t,w)) markDone(sessOfEx(t.id)); } else {t.weight=w;t.history=[{d:today(),w}];sess().exercises.push(t)}
    persist();closeSheet();};
}

/* ---------- interactions ---------- */
function showErr(msg){try{let el=document.getElementById("errbox");if(!el){el=document.createElement("div");el.id="errbox";el.style.cssText="background:var(--danger);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;margin:12px 16px;word-break:break-word";document.body.prepend(el)}el.textContent="Erreur : "+msg}catch(e){}}
window.addEventListener("error",ev=>showErr(ev.message||"inconnue"));
window.addEventListener("unhandledrejection",ev=>showErr((ev.reason&&(ev.reason.code||ev.reason.message))||String(ev.reason)));
document.addEventListener("click",ev=>{try{handleClick(ev)}catch(err){showErr((err&&err.message)||String(err))}});
function arm(b,key,label){if(armed===key)return false;armed=key;b.classList.add("armed");b.textContent=label;return true}
function handleClick(ev){
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  switch(act){
    case "enter-gym": enterGym(id); break;
    case "change-gym": gymId=null; armed=null; render(); try{window.scrollTo(0,0)}catch(e){} break;
    case "new-gym": openEditor("gym",null); break;
    case "export": openEditor("export"); break;
    case "import": openEditor("import"); break;
    case "copy-export": {
      const ta=$("#exp-txt");
      const sel=()=>{ta.focus();ta.select();b.textContent="Texte sélectionné, copie-le"};
      try{navigator.clipboard.writeText(ta.value).then(()=>{b.textContent="Copié ✓"},sel)}catch(e){sel()}
      break;}
    case "do-import": {
      const gyms=parseBackup($("#imp-txt").value.trim()), msg=$("#imp-msg");
      if(!gyms){msg.hidden=false;msg.textContent="Ce texte n'est pas une sauvegarde Fonte. Recopie-le en entier depuis « Exporter mes données ».";break}
      if(state.gyms.length&&arm(b,"import","Confirmer : remplacer mes données"))break;
      state={gyms}; gymId=null; current=null; persist(); closeSheet(); setStatus("Import terminé : "+plural(gyms.length,"salle")); break;}
    case "edit-gym": openEditor("gym",G()); break;
    case "del-gym":
      if(arm(b,"del-gym","Confirmer : supprimer la salle et ses séances"))break;
      state.gyms=state.gyms.filter(g=>g.id!==gymId); gymId=null; persist(); closeSheet(); break;
    case "pick": current=id; armed=null; render(); break;
    case "new-session": openEditor("session",null); break;
    case "edit-session": openEditor("session",sess()); break;
    case "load-example": {const g=G(); g.sessions=exampleSessions(); g.example=true; current=g.sessions[0].id; persist(); render(); break;}
    case "new-ex": openEditor("ex",null); break;
    case "edit-ex": openEditor("ex",findEx(id),b.dataset.focus); break;
    case "close": closeSheet(); break;
    case "save": sheetSave(); break;
    case "plus": case "minus": {const e=findEx(id); if(setWeight(e,e.weight+(act==="plus"?1:-1)*(e.step||2.5))) markDone(sessOfEx(id)); persist(); render(); break;}
    case "toggle-done": {const s=sess(), g=G(); markDone(s,g.done?.[s.id]!==today()); persist(); render(); break;}
    case "wipe":
      if(armed!=="wipe"){armed="wipe";render();break}
      {const g=G(); g.sessions=[]; g.example=false;} current=null; armed=null; persist(); render(); break;
    case "del-session":
      if(arm(b,"del-session","Confirmer la suppression"))break;
      {const g=G(); g.sessions=g.sessions.filter(s=>s.id!==current); current=g.sessions[0]?.id||null;} persist(); closeSheet(); break;
    case "del-ex":
      if(arm(b,"del-ex","Confirmer"))break;
      {const s=sess(); s.exercises=s.exercises.filter(x=>x.id!==id);} persist(); closeSheet(); break;
  }
}
document.addEventListener("keydown",ev=>{
  if(!editing)return;
  if(ev.key==="Escape")closeSheet();
  else if(ev.key==="Enter"&&ev.target.tagName==="INPUT"){ev.preventDefault();sheetSave()}
});

init();
})();
</script>

<script>
if("serviceWorker" in navigator){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
